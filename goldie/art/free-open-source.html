<!doctype html>
<!-- the hero sticker for the store screenshots. render it to free-open-source.png
     as a transparent element screenshot of .sticker at device scale 2 -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      body {
        padding: 40px;
        display: inline-block;
      }
      .sticker {
        display: inline-flex;
        align-items: center;
        gap: 22px;
        padding: 26px 48px 28px 40px;
        border-radius: 999px;
        background: #4fc6d1;
        color: #062326;
        font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
        font-size: 64px;
        font-weight: 800;
        letter-spacing: -0.01em;
        white-space: nowrap;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      }
      .icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 84px;
        height: 84px;
        border-radius: 50%;
        background: #062326;
        color: #4fc6d1;
        font-size: 38px;
        font-weight: 800;
        letter-spacing: -0.04em;
      }
    </style>
  </head>
  <body>
    <div class="sticker"><span class="icon">&lt;/&gt;</span>Free &amp; open source</div>
  </body>
</html>
