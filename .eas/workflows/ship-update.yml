# step 2 of 2: send the verified update to internal testflight builds.
#
# republishes the latest update group on the `verify` branch to the `internal` channel. it
# does not bundle again, so testers get the same files that ran in expo simulators. run it
# only after the update passed on the `verify-simulator` build. see docs/internal-updates.md.
#
#   eas workflow:run ship-update.yml
# or from an agent with the expo mcp `workflow_run` tool (fileName: ship-update.yml).
#
# roll back: run verify-update.yml at the commit you want, check it, then run this again.

name: Ship verified update

on:
  workflow_dispatch: {}

jobs:
  ship:
    name: Republish the verified update to the internal channel
    environment: production
    env:
      OPENMULTICAM_OTA: "1"
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Republish the latest verify update to internal
        run: |
          npx eas-cli@latest update:republish \
            --branch verify \
            --destination-channel internal \
            --platform ios \
            --message "ship the update verified in expo simulators" \
            --non-interactive
